<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8e9"><title>兒童數獨｜姊妹益智樂園</title><link rel="stylesheet" href="../../assets/css/site.css"><link rel="stylesheet" href="sudoku.css"></head><body>
<main class="sudoku-app">
 <section id="setup" class="sudoku-screen"><div class="sudoku-card"><button id="back-list" class="back-button" type="button">← 返回遊戲列表</button><div class="sudoku-logo">🐱🐟</div><h1>兒童數獨<small>ㄦˊ ㄊㄨㄥˊ ㄕㄨˋ ㄉㄨˊ</small></h1><p id="player-badge" class="current-player-badge"></p>
  <div class="setup-step"><h2>① 選棋盤<small>ㄒㄩㄢˇ ㄑㄧˊ ㄆㄢˊ</small></h2><div class="option-row"><button data-setting="size" data-value="4" class="option selected">4 × 4</button><button data-setting="size" data-value="6" class="option">6 × 6</button></div></div>
  <div class="setup-step"><h2>② 選內容<small>ㄒㄩㄢˇ ㄋㄟˋ ㄖㄨㄥˊ</small></h2><div class="option-row"><button data-setting="mode" data-value="number" class="option selected">數字<small>ㄕㄨˋ ㄗˋ</small></button><button data-setting="mode" data-value="picture" class="option">動物<small>ㄉㄨㄥˋ ㄨˋ</small></button></div></div>
  <div class="setup-step"><h2>③ 選難度<small>ㄒㄩㄢˇ ㄋㄢˊ ㄉㄨˋ</small></h2><div class="option-row three"><button data-setting="difficulty" data-value="practice" class="option selected">練習 ⭐<small>ㄌㄧㄢˋ ㄒㄧˊ</small></button><button data-setting="difficulty" data-value="easy" class="option">簡單 ⭐⭐<small>ㄐㄧㄢˇ ㄉㄢ</small></button><button data-setting="difficulty" data-value="challenge" class="option">挑戰 ⭐⭐⭐<small>ㄊㄧㄠˇ ㄓㄢˋ</small></button></div></div>
  <button id="start" class="primary-button big-start">開始遊戲<small>ㄎㄞ ㄕˇ ㄧㄡˊ ㄒㄧˋ</small></button></div></section>
 <section id="game" class="sudoku-screen game-screen" hidden><header><button id="back-setup" class="header-button">← 返回</button><div><h1>貓咪數獨</h1><p id="game-meta"></p></div></header><div class="board-wrap"><div id="board" class="sudoku-board" role="grid"></div><div id="complete" class="complete-overlay" hidden><div>🎉 ⭐ 🐱 ⭐ 🎉</div><h2>完成啦！</h2><p>你好厲害！</p><button id="overlay-next" class="primary-button">下一題</button><button id="overlay-list" class="secondary-button">回遊戲列表</button></div></div><p id="message" class="game-message" aria-live="polite">點一個空格，再選答案</p><div id="answers" class="answer-pad"></div><div class="game-controls"><button id="restart" class="secondary-button">重新開始</button><button id="next" class="secondary-button">下一題</button><button id="hint" class="primary-button">💡 提示 <span id="hint-count"></span></button></div></section>
</main><script src="../../assets/js/content.js"></script><script src="../../assets/js/shared.js"></script><script src="../../assets/js/play.js"></script><script src="engine.js"></script><script src="sudoku.js"></script></body></html>
