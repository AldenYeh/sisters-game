<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>七巧板</title>
<link rel="stylesheet" href="../../assets/css/site.css"><link rel="stylesheet" href="../../assets/css/play.css"><link rel="stylesheet" href="tangram.css"></head>
<body><main class="play-app"><header class="play-top"><button id="back-home" class="back-button" type="button">← 返回</button><div><h1 id="play-title">七巧板</h1><p id="player-badge" class="play-meta"></p></div></header>

<div class="toolbar" id="level-row"></div>
<p id="status" class="msg">拖動、旋轉，拼出剪影</p>
<div class="board-wrap"><svg id="board" class="tan-board" viewBox="0 0 400 400"></svg></div>
<div class="toolbar"><button id="rotate" class="secondary-button" type="button">旋轉</button><button id="flip" class="secondary-button" type="button">翻面</button><button id="restart" class="secondary-button" type="button">重新開始</button><button id="hint" class="primary-button" type="button">提示</button></div>

<div id="complete" class="complete-overlay" hidden><div>🎉 ⭐ 🐱 ⭐ 🎉</div><h2>完成啦！</h2><p></p><button id="overlay-next" class="primary-button" type="button">下一題</button></div>
</main>
<script src="../../assets/js/content.js"></script><script src="../../assets/js/shared.js"></script><script src="../../assets/js/play.js"></script>
<script src="tangram.js"></script></body></html>
