<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼圖</title>
<link rel="stylesheet" href="../../assets/css/site.css">
<link rel="stylesheet" href="../../assets/css/play.css">
<link rel="stylesheet" href="puzzle.css">
</head>
<body>
<main class="play-app">
<header class="play-top">
  <button id="back-home" class="back-button" type="button">← 返回</button>
  <div><h1 id="play-title">拼圖</h1><p id="player-badge" class="play-meta"></p></div>
</header>

<div class="toolbar" id="size-row"></div>
<div class="toolbar" id="art-row"></div>
<p id="status" class="msg">把圖片碎片拖到正確位置</p>
<div class="ref-row"><span>完成圖</span><div id="reference" class="ref-thumb"></div></div>
<div class="puzzle-layout">
  <div class="board-wrap"><div id="board" class="jig-board"></div></div>
  <div id="tray" class="tray"></div>
</div>
<div class="toolbar"><button id="restart" class="secondary-button" type="button">重新開始</button><button id="hint" class="primary-button" type="button">提示</button></div>

<div id="complete" class="complete-overlay" hidden><div>🎉 ⭐ 🐱 ⭐ 🎉</div><h2>完成啦！</h2><p></p><button id="overlay-next" class="primary-button" type="button">下一題</button></div>
</main>
<script src="../../assets/js/content.js"></script>
<script src="../../assets/js/shared.js"></script>
<script src="../../assets/js/play.js"></script>
<script src="puzzle.js"></script>
</body>
</html>
