<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e8">
  <title></title>
  <link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/lifecycle.css"><link rel="stylesheet" href="assets/css/family.css"><link rel="stylesheet" href="assets/css/game-layout.css"></head>
<body>
  <main class="hub-shell">
    <section id="player-screen" class="hero-card hub-screen" aria-labelledby="site-title">
      <header class="site-heading cat-heading">
        <div class="cat-mark" aria-hidden="true">🐱</div>
        <h1 id="site-title"></h1>
        <div class="paw-divider" aria-hidden="true">🐾　🐟　🐾</div>
      </header>
      <section class="hub-section" aria-labelledby="player-title">
        <h2 id="player-title"></h2>
        <div id="player-list" class="player-list"></div>
        <p id="player-status" class="selection-status" aria-live="polite"></p>
      </section>
    </section>

    <section id="category-screen" class="hero-card hub-screen" aria-labelledby="category-title" hidden>
      <button id="back-to-players" class="back-button" type="button"></button>
      <header class="site-heading">
        <div class="cat-mark" aria-hidden="true">🐱</div>
        <h1 id="category-title"></h1>
        <p id="category-player" class="current-player-badge"></p>
      </header>
      <div id="category-list" class="choice-list"></div>
    </section>

    <section id="games-screen" class="hero-card hub-screen" aria-labelledby="games-title" hidden>
      <button id="back-to-categories" class="back-button" type="button"></button>
      <header class="site-heading">
        <div class="cat-mark" aria-hidden="true">🧩</div>
        <h1 id="games-title"></h1>
        <p id="games-player" class="current-player-badge"></p>
      </header>
      <section class="hub-section">
        <div id="game-list" class="choice-list"></div>
      </section>
    </section>
  </main>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/shared.js"></script><script src="assets/js/family-core.js"></script><script src="assets/js/family.js"></script><script src="assets/js/lifecycle.js"></script><script src="assets/js/challenges.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
